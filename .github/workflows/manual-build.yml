name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch    # 1.2.3 → 1.2.4
          - minor    # 1.2.3 → 1.3.0
          - major    # 1.2.3 → 2.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Get latest release tag
        id: get_version
        shell: pwsh
        run: |
          # Get the latest git tag (expected format: v1.2.3)
          $latestTag = git describe --tags --abbrev=0 --match "v*" 2>$null
          if (-not $latestTag -or $latestTag -eq "") {
            $latestTag = "v0.0.0"
          }
          
          # Parse version components
          $version = $latestTag -replace '^v',''
          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          
          # Bump version based on user input
          $type = "${{ github.event.inputs.version_type }}"
          switch ($type) {
            "major" { $major++; $minor = 0; $patch = 0 }
            "minor" { $minor++; $patch = 0 }
            "patch" { $patch++ }
          }
          
          $newVersion = "v$major.$minor.$patch"
          echo "new_version=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version bump: $latestTag → $newVersion ($type)"

      - name: Create changelog
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 --match "v*" 2>$null
          if ($latestTag) {
            $gitLog = git log "$latestTag..HEAD" --pretty="format:- [%s](https://github.com/myildirimofficial/RSBot/commit/%H) - @%an"
          } else {
            $gitLog = git log --pretty="format:- [%s](https://github.com/myildirimofficial/RSBot/commit/%H) - @%an"
          }
          Set-Content -Path "commit_log.md" -Value $gitLog -Encoding UTF8
          $currentLog = Get-Content -Path commit_log.md -Raw
          $logWithHeader = "## What's Changed`n" + $currentLog
          Set-Content -Path commit_log.md -Value $logWithHeader

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Handle dependencies
        run: dotnet restore RSBot.sln

      - name: Create the app package
        run: |
          msbuild /p:Configuration=Release /p:Platform=x86
          cd Build
          Compress-Archive -Path ".\*" -DestinationPath ".\..\RSBot.${{ steps.get_version.outputs.new_version }}.zip"
          cd ..

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: RSBot ${{ steps.get_version.outputs.new_version }}
          tag_name: ${{ steps.get_version.outputs.new_version }}
          body_path: commit_log.md
          prerelease: false
          files: RSBot.${{ steps.get_version.outputs.new_version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
